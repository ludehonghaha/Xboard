name: Xboard Lite PHP Lint

on:
  push:
    branches:
      - xboard-lite-v1
  workflow_dispatch:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP version
        run: php -v
      - name: Lint PHP sources
        shell: bash
        run: |
          set -euo pipefail
          find app routes config database plugins-core -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Smoke standalone NoBrand installer
        shell: bash
        run: |
          set -euo pipefail
          php tests/Smoke/NoBrandInstallerSmoke.php

      - name: Lint Lite admin JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path("resources/views/admin.blade.php").read_text(encoding="utf-8")
          marker = "// Xboard Lite admin cleanup."
          pos = source.find(marker)
          if pos < 0:
              raise SystemExit("Lite admin marker not found")
          script_start = source.rfind("<script>", 0, pos)
          script_end = source.find("</script>", pos)
          if script_start < 0 or script_end < 0:
              raise SystemExit("Lite admin script block not found")
          js = source[script_start + len("<script>"):script_end]
          Path("/tmp/xboard-lite-admin.js").write_text(js, encoding="utf-8")
          PY
          node --check /tmp/xboard-lite-admin.js

      - name: Validate NoBrand policy agent
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile agents/nobrand-policy/policy_agent.py
          bash -n agents/nobrand-policy/install.sh
          python3 agents/nobrand-policy/policy_agent.py --version

      - name: Smoke NoBrand policy agent
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/Smoke/NoBrandPolicyAgentSmoke.py
